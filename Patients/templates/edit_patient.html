{% extends 'base.html' %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
    <div class="container py-4">
        <h2 class="mb-4">Edit Patient</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
